<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Homebase</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a1b16'/><circle cx='50' cy='46' r='24' fill='none' stroke='%23a6c199' stroke-width='6'/><line x1='50' y1='64' x2='50' y2='82' stroke='%23a6c199' stroke-width='6' stroke-linecap='round'/></svg>" />
    <meta name="theme-color" content="#1a1b16" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #1a1b16;
        color: #eaece7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 340px;
        background: #2e2f28;
        border: 1px solid #3d3f36;
        border-radius: 16px;
        padding: 28px 24px 24px;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.28);
        text-align: center;
      }
      .mark { width: 54px; height: 54px; border-radius: 13px; display: block; margin: 0 auto 14px; }
      h1 {
        margin: 0 0 4px;
        font-family: Fraunces, Georgia, "Times New Roman", serif;
        font-weight: 600;
        font-size: 1.5rem;
        letter-spacing: 0.005em;
      }
      p.sub { margin: 0 0 20px; color: #a1a69d; font-size: 0.9rem; }
      form { display: flex; flex-direction: column; gap: 12px; }
      input {
        width: 100%;
        padding: 12px 14px;
        font-size: 1rem;
        color: #eaece7;
        background: #1a1b16;
        border: 1px solid #3d3f36;
        border-radius: 10px;
        outline: none;
        text-align: center;
        letter-spacing: 0.08em;
      }
      input:focus { border-color: #a6c199; }
      button {
        width: 100%;
        padding: 12px 14px;
        font-size: 1rem;
        font-weight: 600;
        color: #1a1b16;
        background: #a6c199;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      button:active { background: #90ac82; }
      button:disabled { opacity: 0.6; cursor: default; }
      .err { min-height: 1.2em; margin: 4px 0 0; color: #cf8b8f; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="22" fill="#1a1b16" />
        <circle cx="50" cy="46" r="24" fill="none" stroke="#a6c199" stroke-width="6" />
        <line x1="50" y1="64" x2="50" y2="82" stroke="#a6c199" stroke-width="6" stroke-linecap="round" />
      </svg>
      <h1>Homebase</h1>
      <p class="sub">Enter the household passcode to continue.</p>
      <form id="loginForm">
        <input
          id="passcode"
          type="password"
          inputmode="text"
          autocomplete="current-password"
          enterkeyhint="go"
          placeholder="Passcode"
          aria-label="Household passcode"
          autofocus
        />
        <button id="submit" type="submit">Unlock</button>
        <p class="err" id="err" role="alert"></p>
      </form>
    </div>
    <script>
      const form = document.getElementById("loginForm");
      const input = document.getElementById("passcode");
      const btn = document.getElementById("submit");
      const err = document.getElementById("err");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.textContent = "";
        btn.disabled = true;
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ passcode: input.value }),
          });
          if (res.ok) {
            window.location.replace("/");
            return;
          }
          err.textContent = "Incorrect passcode. Try again.";
        } catch {
          err.textContent = "Couldn't reach the server. Check your connection.";
        }
        btn.disabled = false;
        input.select();
      });
    </script>
  </body>
</html>
