# One-click deploy config for Render (https://render.com — free tier).
# When you're ready to put the app online, we'll push this folder to a GitHub
# repo, then "New + > Blueprint" on Render and point it here.
services:
  - type: web
    name: at-home-meal-planner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Set the actual values in the Render dashboard (Environment tab) — never commit secrets.
      - key: SPOONACULAR_API_KEY
        sync: false
      # Cross-device sync (Upstash Redis REST).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Auth: either APP_PASSCODE (single household) or HOUSEHOLDS (multi-tenant,
      # "id:passcode,..."). Set APP_SESSION_SECRET to a long random string so
      # sessions survive roster edits. See .env.example for details.
      - key: APP_PASSCODE
        sync: false
      - key: HOUSEHOLDS
        sync: false
      - key: APP_SESSION_SECRET
        sync: false
